<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="left">left</div>
        <div class="right">right</div>
    </div>
</body>
<style>
    .container{
        height: 400px;
        position: relative;

    }
    .left{
        width: 200px;
        background-color: aqua;
    }
    .right{
        position: absolute;
        left: 200px;
        right: 0;
        top: 0;
        height: 100%;
        background-color: burlywood;
    }
</style>
</html>
